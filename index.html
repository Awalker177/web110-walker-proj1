<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Links for Font-Awesome and Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS Link -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Title of the page -->
    <title>Bono App | Sign Up</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <!-- Logo Image Link -->
            <a href="index.html">
                <img class="logo" src="images/logo.svg" alt="Bono App Logo" />
            </a>
            <!-- Contact Information Section -->
            <div class="header-right">
                <div><i class="fas fa-envelope"></i> contact@bono.com</div>
                <div><i class="fas fa-phone"></i> (+31) 021-800-8244</div>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </header>

        <main class="main-content">
            <form>
                <!-- Form Group for Name, Email, and Message -->
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required />
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required />
                </div>
                <!-- Added Placeholder for Message Text Area -->
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Enter your message here..."></textarea>
                </div>

                <!-- Submit Button -->
                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form>

            <!-- Text Section -->
            <div class="text-container">
                <h1>Coming Soon For Every Developer</h1>
                <p>
                    Our new Bono web app will change the way you think about 
                    content 
                    management and will allow you to focus on what's really
                    important. 
                    Use the contact form to send us your thoughts
                </p>
            </div>
        </main>
    </div>
